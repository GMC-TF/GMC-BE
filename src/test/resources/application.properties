spring.application.name=backend-test

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT (test values)
jwt.secret=test-secret-key-for-testing-purposes-only-must-be-long-enough
jwt.expiration=3600000

# OAuth2 (test values)
oauth2.redirect-uri=http://localhost:3000/oauth/callback

# Disable OAuth2 auto-configuration in tests
spring.security.oauth2.client.registration.google.client-id=test
spring.security.oauth2.client.registration.google.client-secret=test

# AWS S3 (test dummy values)
aws.access-key=test-access-key
aws.secret-key=test-secret-key
aws.region=ap-northeast-2
aws.s3.bucket=test-bucket